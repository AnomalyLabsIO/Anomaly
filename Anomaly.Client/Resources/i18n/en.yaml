# Anomaly translations — English (canonical source).
#
# Format: flat YAML, double-quoted values. Keys must start with the "anomaly." namespace
# (enforced at load time). TextMeshPro rich-text tags (<color>, <b>, <size>, <size=...>) are
# allowed inside values and rendered by TMP. Use \n for newlines, \" for embedded quotes.
# Placeholders use .NET string.Format positional syntax: {0}, {1}, {2}, ...
#
# When a key takes placeholders, document them with a comment on the line above so translators
# know what each slot contains and don't reorder them silently.

# ===== Authentication / connection overlays =====
"anomaly.overlay.authenticating": "Authenticating, Please Wait..."
"anomaly.overlay.connection_authenticating": "Authenticating...\nPlease wait while the server identifies you."
"anomaly.overlay.password_required": "Password required\nEnter the server password to continue."
"anomaly.password_prompt.title": "Server Password Required"
"anomaly.password_prompt.hint": "Type or paste the password, then press Enter. Press Esc to cancel."
"anomaly.prompt.cancel": "Cancel"
"anomaly.prompt.connect": "Connect"
"anomaly.prompt.save": "Save nickname"
"anomaly.prompt.dismiss": "Dismiss"
"anomaly.prompt.trust_connect": "Trust and connect"
"anomaly.prompt.allow_content": "Allow content"
"anomaly.prompt.skip_content": "Skip content"
"anomaly.prompt.save_error": "Could not save. Check that Anomaly's UserData folder is writable, then try again. Your input is still here."
"anomaly.prompt.nickname_title": "Choose your Anomaly nickname"
