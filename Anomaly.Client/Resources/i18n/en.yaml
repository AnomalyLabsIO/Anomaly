"anomaly.prompt.nickname_invalid": "Enter 1–32 visible characters. Control characters are not allowed."
"anomaly.prompt.keyboard_hint": "Tab: next control · Page Up/Down: scroll details · Esc: cancel"

# ===== File transfer overlay =====
"anomaly.overlay.file_transfer.preparing": "Preparing download..."
# {0} = filename, {1} = current file index (1-based), {2} = total file count
"anomaly.overlay.file_transfer.downloading": "Downloading {0}  {1}/{2}"
"anomaly.overlay.file_transfer.connecting": "Connecting to server..."
# {0} = number of assets being loaded
"anomaly.overlay.file_transfer.loading_level": "Loading facility... ({0} assets)"

# ===== News panel (in-game launcher news) =====
"anomaly.news.anomaly.title": "<color=#d5660d>Anomaly early access</color>"
"anomaly.news.anomaly.body": "<b>Welcome to Anomaly</b>\n\nTry community mods with a matching client and server release. Mod preferences are in Settings → Mods.\n\nDevelopers: start with the SDK's MelonMod sample. Run anomaly.status in the game console when reporting a problem.\n\nEarly access: APIs and game hooks may change between releases."
# {0} = installed Anomaly version
"anomaly.news.anomaly.date": "Anomaly {0} · Early access"

