# Anomaly translations — English (canonical source).
#
# Format: flat YAML, double-quoted values. Keys must start with the "anomaly." namespace
# (enforced at load time). TextMeshPro rich-text tags (<color>, <b>, <size>, <size=...>) are
# allowed inside values and rendered by TMP. Use \n for newlines, \" for embedded quotes.
# Placeholders use .NET string.Format positional syntax: {0}, {1}, {2}, ...
#
# When a key takes placeholders, document them with a comment on the line above so translators
# know what each slot contains and don't reorder them silently.

# ===== Authentication / connection overlays =====
"anomaly.overlay.authenticating": "Authenticating, Please Wait..."
"anomaly.overlay.connection_authenticating": "<size=80>Authenticating...</size>\nPlease wait while the server identifies you."
"anomaly.overlay.password_required": "<size=80>Password Required</size>\nEnter the server password to continue."
"anomaly.password_prompt.title": "Server Password Required"
"anomaly.password_prompt.hint": "Type the password, then press Enter. Press Esc to cancel."

# ===== File transfer overlay =====
"anomaly.overlay.file_transfer.preparing": "Preparing download..."
# {0} = filename, {1} = current file index (1-based), {2} = total file count
"anomaly.overlay.file_transfer.downloading": "Downloading {0}  {1}/{2}"
"anomaly.overlay.file_transfer.connecting": "Connecting to server..."
# {0} = number of assets being loaded
"anomaly.overlay.file_transfer.loading_level": "Loading facility... ({0} assets)"

# ===== News panel (in-game launcher news) =====
"anomaly.news.anomaly.title": "<color=#ff3300>Anomaly</color>"
"anomaly.news.anomaly.body": "<b><size=20>Welcome to Anomaly, a SCP:SL modded version.</size></b>\n\n<color=#ec0c02>Alpha Build</color>"
"anomaly.news.anomaly.date": "April 5, 2026"

# ===== Main menu =====
# {0} = username
"anomaly.menu.welcome": "Welcome back, {0}"
# {0} = username
"anomaly.menu.auth_connected": "Connected as {0}"
"anomaly.menu.auth_not_signed_in": "Not signed in"

# ===== Misc =====
# Appended to the version string when running modded; leading space is intentional.
"anomaly.version_modded_suffix": " (MODDED)"
